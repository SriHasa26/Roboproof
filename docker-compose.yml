# Live rehearsal backend: `docker compose up` starts the API on http://localhost:8000
# Secrets come from .env at run time (never baked into the image). Live runs are OFF unless LIVE_ENABLED=1 in .env.
services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.sim
    image: roboproof-sim:dev
    env_file:
      - path: .env
        required: false
    environment:
      LIVE_RUNS_DIR: /app/live_runs
      ROBOPROOF_DB: /app/backend/data/roboproof.sqlite
      LLM_DEV_CACHE: "0"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"   # the site's origin(s), comma separated
      LIVE_ENABLED: "${LIVE_ENABLED:-0}"   # set LIVE_ENABLED=1 in .env (or the shell) to allow live runs
    ports:
      - "${API_PORT:-8000}:8000"   # set API_PORT if 8000 is already in use
    volumes:
      - ./live_runs:/app/live_runs          # run artifacts, events and the daily quota ledger
      - ./backend/data:/app/backend/data    # SQLite (seed ledger and LLM call log) persists across restarts
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
