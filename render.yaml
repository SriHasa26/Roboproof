# Render Blueprint for ONE free Docker web service: the built site and the API on the same port (docker/Dockerfile.host).
# Not deployed by this repository; connect the repo on render.com (New > Blueprint) when you choose to. No secret values appear here:
# every `sync: false` variable is entered in the Render dashboard.
#
# Free-instance facts to plan around (Render's own terms; check their current docs): the service spins down after about 15 minutes without
# traffic and wakes on the next request in roughly a minute; local disk is lost on spin-down; CPU and RAM are small. See docs/HOSTING.md for
# measured memory and time in a container limited to 512 MB / 0.5 CPU and to 2 GB / 2 CPUs.
services:
  - type: web
    name: roboproof
    runtime: docker
    plan: free
    dockerfilePath: ./docker/Dockerfile.host
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      # --- what the container needs (PORT is set by Render itself)
      - key: ROBOPROOF_HOST_MODE        # already set in the image; small defaults for sweep size and batch rows
        value: "1"
      - key: DATA_DIR                   # runtime data (live runs, daily counters, SQLite): local disk, lost on spin-down
        value: /tmp/roboproof
      # --- limits (host-mode defaults shown; hard caps are 200)
      - key: MAX_SWEEP_N
        value: "50"
      - key: MAX_BATCH_ROWS
        value: "50"
      - key: RUN_TIMEOUT_S              # kill a full pipeline run after this long
        value: "600"
      - key: LIVE_KEEP_RUNS             # finished run folders kept on disk
        value: "20"
      # --- model-backed features. Everything that calls a model is OFF unless LIVE_ENABLED=1.
      - key: LIVE_ENABLED
        value: "0"
      - key: LIVE_PIPELINE_ENABLED      # 0 disables ONLY the full pipeline run; scenario, sweep, batch, interpret and analyze keep working
        value: "0"
      - key: LIVE_DAILY_RUN_CAP
        value: "5"
      - key: LIVE_DAILY_USD_CAP
        value: "1.0"
      - key: LIVE_RATE_PER_IP_PER_HOUR
        value: "3"
      - key: LIVE_TRUST_PROXY           # Render puts the client address in X-Forwarded-For
        value: "1"
      - key: ALLOWED_ORIGINS            # only needed if the site is served from a different origin than the API
        value: ""
      # --- secrets and model names: set in the dashboard, never here
      - key: NEBIUS_API_KEY
        sync: false
      - key: NEBIUS_BASE_URL
        sync: false
      - key: NEBIUS_MODEL_FAST
        sync: false
      - key: NEBIUS_MODEL_REASONING
        sync: false
      - key: NEBIUS_MODEL_FALLBACK
        sync: false
      - key: LIVE_ACCESS_CODE           # optional shared code for live runs
        sync: false
