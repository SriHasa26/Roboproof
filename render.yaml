# Render Blueprint for ONE free Docker web service: the built site and the API on the same port (docker/Dockerfile.host).
# Not deployed by this repository; connect the repo on render.com (New > Blueprint) when you choose to. No secret values appear here:
# every `sync: false` variable is entered in the Render dashboard.
#
# Free-instance facts to plan around (Render's own terms; check their current docs): the service spins down after about 15 minutes without
# traffic and wakes on the next request in roughly a minute; local disk is lost on spin-down; CPU and RAM are small (possibly about 0.1 CPU,
# up to 5x slower than the 0.5 CPU I measured). See docs/HOSTING.md for the measurements.
services:
  - type: web
    name: roboproof
    runtime: docker
    plan: free
    dockerfilePath: docker/Dockerfile.host
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      # PORT is set by Render itself (default 10000); locally the image defaults to 7860.
      - key: ROBOPROOF_HOST_MODE        # small defaults and longer timeouts for a very small instance
        value: "1"
      - key: DATA_DIR                   # runtime data (live runs, daily counters, SQLite): local disk, lost on spin-down
        value: /tmp/roboproof
      # --- what is switched on
      - key: PLAYGROUND_ENABLED         # the simulator playground
        value: "1"
      - key: LIVE_ENABLED               # master switch for anything that calls a model; set to 1 only if you want interpret and analyze online
        value: "0"
      - key: LIVE_PIPELINE_ENABLED      # 0 disables ONLY the full pipeline run (it needs minutes of CPU)
        value: "0"
      - key: VERIFY_ENABLED             # 0: "Verify this result" shows the terminal command; the re-simulation does not fit this host
        value: "0"
      # --- limits for a very small CPU (every timeout below can be raised if the host is bigger)
      - key: MAX_SWEEP_N
        value: "20"
      - key: MAX_BATCH_ROWS
        value: "20"
      - key: SCENARIO_TIMEOUT_S
        value: "30"
      - key: SWEEP_TIMEOUT_S
        value: "90"
      - key: BATCH_TIMEOUT_S
        value: "90"
      - key: VERIFY_TIMEOUT_S
        value: "54"
      - key: INTERPRET_TIMEOUT_S        # per model call
        value: "45"
      - key: ANALYZE_TIMEOUT_S          # per model call
        value: "120"
      - key: RUN_TIMEOUT_S              # full pipeline run (only if LIVE_PIPELINE_ENABLED=1)
        value: "600"
      - key: LIVE_KEEP_RUNS
        value: "20"
      - key: LIVE_DAILY_RUN_CAP
        value: "5"
      - key: LIVE_DAILY_USD_CAP
        value: "1.0"
      - key: LIVE_RATE_PER_IP_PER_HOUR
        value: "3"
      - key: LIVE_TRUST_PROXY           # Render puts the client address in X-Forwarded-For
        value: "1"
      # --- set in the dashboard (names only here; never put values in this file)
      - key: ALLOWED_ORIGINS            # only needed if the site is served from a different origin than the API
        sync: false
      - key: NEBIUS_API_KEY
        sync: false
      - key: NEBIUS_BASE_URL
        sync: false
      - key: NEBIUS_MODEL_FAST
        sync: false
      - key: NEBIUS_MODEL_REASONING
        sync: false
      - key: NEBIUS_MODEL_FALLBACK
        sync: false
      - key: LIVE_ACCESS_CODE
        sync: false
